[project]
name = "jolarca-docs"
version = "0.1.0"
description = "Compliance documentation hub for the jolarca-dev fleet: cross-repo ADR index, SOC 2 description of the system, and a generated fleet-inventory view. Owns no fact another repository owns."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "jolarca-dev" }]
keywords = ["soc2", "iso27001", "gdpr", "pci-dss", "adr", "governance", "documentation"]

# Exactly ONE runtime dependency (ADR DOC-0003). The generation pipeline must
# parse YAML (allow-list) and Markdown front-matter; the standard library has no
# YAML parser and hand-rolling one is more risk than the dependency. Pinned so
# Dependabot owns every bump as an auditable change.
dependencies = [
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
# Dev-only tooling. Never shipped, never imported by generated artifacts.
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["scripts", "tests"]

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes. I: import order. UP: pyupgrade. B: bugbear.
# C4: comprehension hygiene. SIM: simplification. RUF: ruff-native checks.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures deliberately contain planted violations and throwaway modules.
"tests/fixtures/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["scripts", "tests"]
mypy_path = "scripts"
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]
