# Initial local toolchain adoption; see MISE-ADOPTION.md for validation limits.
# Strict lockfile mode for the tools declared in this config root (ADR-0010 M-02).
# install_args: --locked in the workflow binds the job, not the repository; a plain
# `mise install` was never bound by it. [tool_config] is not merged and reaches only
# tools declared here, so .miserc.toml must ship with it, not after it.
[tool_config]
locked = true

[tools]
python = "3.12.16"
node = "22.23.4"

[tasks.toolchain]
description = "Print selected tool versions; this is not a compliance gate"
run = [
  "python --version",
  "node --version",
]
